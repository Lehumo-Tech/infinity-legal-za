apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinity-legal-za
  namespace: infinity-legal
  labels:
    app: infinity-legal-za
spec:
  replicas: 3
  selector:
    matchLabels:
      app: infinity-legal-za
  template:
    metadata:
      labels:
        app: infinity-legal-za
    spec:
      containers:
      - name: app
        image: infinity-legal-za:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: infinity-legal-secrets
              key: supabase-url
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: infinity-legal-secrets
              key: supabase-anon-key
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: infinity-legal-secrets
              key: supabase-service-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: infinity-legal-za
  namespace: infinity-legal
spec:
  selector:
    app: infinity-legal-za
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infinity-legal-za
  namespace: infinity-legal
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - infinity-legal.co.za
    - www.infinity-legal.co.za
    secretName: infinity-legal-tls
  rules:
  - host: infinity-legal.co.za
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infinity-legal-za
            port:
              number: 80
  - host: www.infinity-legal.co.za
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infinity-legal-za
            port:
              number: 80
