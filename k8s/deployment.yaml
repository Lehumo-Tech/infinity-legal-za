apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinity-legal-web
  namespace: infinity-legal
  labels:
    app: infinity-legal
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infinity-legal
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: infinity-legal
        component: web
    spec:
      containers:
        - name: web
          image: infinity-legal/web:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/db
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: infinity-legal-sqlite-pvc
      terminationGracePeriodSeconds: 30
