<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 400 80" style="enable-background:new 0 0 400 80;" xml:space="preserve">
  <title>Infinity Legal SA - Horizontal Logo</title>
  <desc>Horizontal version of the Infinity Legal SA logo featuring the infinity-scales symbol and company name in gold and navy</desc>

  <defs>
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ddc06e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88832;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3358;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1e3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hGoldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ddc06e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88832;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- === INFINITY-SCALES SYMBOL (left) === -->
  <g transform="translate(40, 40)">
    <!-- Scale beam (horizontal bar) -->
    <line x1="-32" y1="-2" x2="32" y2="-2" stroke="url(#hGoldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Center pillar -->
    <line x1="0" y1="-18" x2="0" y2="8" stroke="url(#hGoldGrad)" stroke-width="3" opacity="0.5"/>

    <!-- Top ornament -->
    <circle cx="0" cy="-18" r="5" fill="url(#hGoldGrad)"/>
    <circle cx="0" cy="-18" r="2.5" fill="#0c1e3c"/>

    <!-- Left scale pan (ellipse) -->
    <ellipse cx="-22" cy="10" rx="18" ry="7" fill="none" stroke="url(#hGoldGrad)" stroke-width="3"/>

    <!-- Left chains -->
    <line x1="-32" y1="-2" x2="-34" y2="5" stroke="url(#hGoldGrad)" stroke-width="1.8"/>
    <line x1="-12" y1="-2" x2="-10" y2="5" stroke="url(#hGoldGrad)" stroke-width="1.8"/>

    <!-- Right scale pan (ellipse) -->
    <ellipse cx="22" cy="10" rx="18" ry="7" fill="none" stroke="url(#hGoldGrad)" stroke-width="3"/>

    <!-- Right chains -->
    <line x1="12" y1="-2" x2="10" y2="5" stroke="url(#hGoldGrad)" stroke-width="1.8"/>
    <line x1="32" y1="-2" x2="34" y2="5" stroke="url(#hGoldGrad)" stroke-width="1.8"/>

    <!-- Infinity crossover center (lemniscate hint) -->
    <path d="M0,-2 C0,-8 8,-10 10,-4 C8,-10 0,-8 0,-2 Z" fill="url(#hGoldGrad)" opacity="0.7"/>
    <path d="M0,-2 C0,4 -8,6 -10,0 C-8,6 0,4 0,-2 Z" fill="url(#hGoldGrad)" opacity="0.7"/>

    <!-- Left infinity loop hint -->
    <path d="M-18,-2 C-18,-14 -6,-16 0,-8 C-6,-16 -18,-14 -18,-2 C-18,10 -30,14 -34,6 C-30,14 -18,10 -18,-2 Z"
          fill="none" stroke="url(#hGoldGrad)" stroke-width="2.5" opacity="0.4"/>

    <!-- Right infinity loop hint -->
    <path d="M18,-2 C18,-14 6,-16 0,-8 C6,-16 18,-14 18,-2 C18,10 30,14 34,6 C30,14 18,10 18,-2 Z"
          fill="none" stroke="url(#hGoldGrad)" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Decorative vertical divider -->
  <line x1="80" y1="14" x2="80" y2="66" stroke="url(#hGoldGrad)" stroke-width="1.5" opacity="0.35"/>

  <!-- === TEXT GROUP === -->
  <g>
    <!-- INFINITY -->
    <text x="92" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" letter-spacing="5" fill="url(#hGoldGrad)">INFINITY</text>

    <!-- LEGAL -->
    <text x="92" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="normal" letter-spacing="8" fill="url(#hGoldGrad)" opacity="0.85">LEGAL</text>

    <!-- SA (smaller, superscript-style) -->
    <text x="210" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="2" fill="url(#hGoldV)" opacity="0.7">SA</text>

    <!-- Decorative underline -->
    <line x1="92" y1="70" x2="245" y2="70" stroke="url(#hGoldGrad)" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
