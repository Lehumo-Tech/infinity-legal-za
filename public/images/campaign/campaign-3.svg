<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 500" xml:space="preserve">
  <title>Access to Justice Initiative - Campaign Illustration</title>
  <desc>Campaign illustration for Access to Justice featuring an open doorway with light, people silhouettes, scales of justice, and architectural elements</desc>

  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3358;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ddc06e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88832;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold3v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ddc06e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88832;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f2647;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3358;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightWarm" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6b8;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ddc06e;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="doorLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#f5e6b8;stop-opacity:0.35" />
      <stop offset="40%" style="stop-color:#ddc06e;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#0c1e3c;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#162d50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3358;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#162d50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3358;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1e3c;stop-opacity:1" />
    </linearGradient>

    <filter id="lightBeam" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.88  0 0 0 0 0.55  0 0 0 0.4 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.788  0 0 0 0 0.659  0 0 0 0 0.298  0 0 0 0.2 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- Radial light from door -->
  <rect width="800" height="500" fill="url(#doorLight)"/>

  <!-- ===== STEPS ===== -->
  <rect x="180" y="380" width="440" height="20" rx="2" fill="url(#stepGrad)" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
  <rect x="160" y="400" width="480" height="20" rx="2" fill="url(#stepGrad)" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <rect x="140" y="420" width="520" height="20" rx="2" fill="url(#stepGrad)" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>
  <rect x="120" y="440" width="560" height="60" rx="2" fill="url(#stepGrad)" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
  <!-- Step highlight lines -->
  <line x1="185" y1="381" x2="615" y2="381" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
  <line x1="165" y1="401" x2="635" y2="401" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>

  <!-- ===== LEFT PILLAR ===== -->
  <g>
    <!-- Pillar base -->
    <rect x="195" y="340" width="40" height="42" rx="2" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <!-- Pillar shaft -->
    <rect x="200" y="100" width="30" height="240" rx="2" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
    <!-- Pillar capital -->
    <rect x="190" y="88" width="50" height="16" rx="3" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <!-- Fluting -->
    <line x1="210" y1="104" x2="210" y2="340" stroke="#c9a84c" stroke-width="0.4" opacity="0.15"/>
    <line x1="220" y1="104" x2="220" y2="340" stroke="#c9a84c" stroke-width="0.4" opacity="0.15"/>
  </g>

  <!-- ===== RIGHT PILLAR ===== -->
  <g>
    <!-- Pillar base -->
    <rect x="565" y="340" width="40" height="42" rx="2" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <!-- Pillar shaft -->
    <rect x="570" y="100" width="30" height="240" rx="2" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
    <!-- Pillar capital -->
    <rect x="560" y="88" width="50" height="16" rx="3" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
    <!-- Fluting -->
    <line x1="580" y1="104" x2="580" y2="340" stroke="#c9a84c" stroke-width="0.4" opacity="0.15"/>
    <line x1="590" y1="104" x2="590" y2="340" stroke="#c9a84c" stroke-width="0.4" opacity="0.15"/>
  </g>

  <!-- ===== LINTEL / ENTABLATURE ===== -->
  <rect x="185" y="72" width="430" height="18" rx="3" fill="url(#pillarGrad)" stroke="#c9a84c" stroke-width="1" opacity="0.7"/>
  <!-- Lintel decoration -->
  <line x1="200" y1="81" x2="600" y2="81" stroke="#c9a84c" stroke-width="0.6" opacity="0.25"/>
  <!-- "ACCESS FOR ALL" text in the architecture -->
  <text x="400" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="bold" letter-spacing="6" fill="#c9a84c" opacity="0.35">ACCESS FOR ALL</text>

  <!-- ===== PEDIMENT (triangle above lintel) ===== -->
  <polygon points="400,30 180,72 620,72" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.4"/>
  <polygon points="400,38 195,72 605,72" fill="#0c1e3c" opacity="0.5"/>
  <!-- Pediment inner decoration -->
  <line x1="400" y1="42" x2="400" y2="62" stroke="#c9a84c" stroke-width="0.8" opacity="0.2"/>
  <circle cx="400" cy="52" r="4" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"/>

  <!-- ===== DOOR FRAME ===== -->
  <rect x="240" y="88" width="320" height="295" rx="4" fill="#091829" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>

  <!-- ===== OPEN DOOR - LIGHT EMANATING ===== -->
  <g filter="url(#lightBeam)">
    <!-- Door opening light -->
    <rect x="250" y="95" width="300" height="280" rx="2" fill="#f5e6b8" opacity="0.25"/>
  </g>

  <!-- Left door (open, swung left) -->
  <g>
    <path d="M250,95 L250,375 L280,375 L280,105 Z" fill="url(#doorGrad)" stroke="#c9a84c" stroke-width="0.8" opacity="0.8"/>
    <!-- Door panel details -->
    <rect x="253" y="115" width="24" height="100" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
    <rect x="253" y="235" width="24" height="100" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
    <!-- Door handle -->
    <circle cx="276" cy="240" r="3" fill="#c9a84c" opacity="0.6"/>
  </g>

  <!-- Right door (open, swung right) -->
  <g>
    <path d="M550,95 L550,375 L520,375 L520,105 Z" fill="url(#doorGrad)" stroke="#c9a84c" stroke-width="0.8" opacity="0.8"/>
    <!-- Door panel details -->
    <rect x="523" y="115" width="24" height="100" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
    <rect x="523" y="235" width="24" height="100" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.3"/>
    <!-- Door handle -->
    <circle cx="524" cy="240" r="3" fill="#c9a84c" opacity="0.6"/>
  </g>

  <!-- ===== LIGHT RAYS from door ===== -->
  <g opacity="0.15">
    <polygon points="400,200 100,460 160,460" fill="url(#gold3)"/>
    <polygon points="400,200 280,460 340,460" fill="url(#gold3)"/>
    <polygon points="400,200 460,460 520,460" fill="url(#gold3)"/>
    <polygon points="400,200 640,460 700,460" fill="url(#gold3)"/>
    <polygon points="400,200 40,500 110,470" fill="url(#gold3)"/>
    <polygon points="400,200 690,470 760,500" fill="url(#gold3)"/>
  </g>
  <!-- Wider light wash -->
  <polygon points="300,120 500,120 700,460 100,460" fill="#f5e6b8" opacity="0.04"/>

  <!-- ===== SCALES OF JUSTICE (above doorway) ===== -->
  <g transform="translate(400, 50)" filter="url(#softGlow3)">
    <!-- Center post -->
    <line x1="0" y1="-30" x2="0" y2="5" stroke="#c9a84c" stroke-width="2.5"/>
    <!-- Beam -->
    <line x1="-30" y1="-18" x2="30" y2="-18" stroke="#c9a84c" stroke-width="2.5"/>
    <!-- Top -->
    <circle cx="0" cy="-30" r="5" fill="#c9a84c"/>
    <!-- Left chain -->
    <line x1="-30" y1="-18" x2="-30" y2="-5" stroke="#c9a84c" stroke-width="1.5"/>
    <line x1="-15" y1="-18" x2="-15" y2="-5" stroke="#c9a84c" stroke-width="1.5"/>
    <!-- Left pan -->
    <ellipse cx="-22" cy="-2" rx="16" ry="5" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <!-- Right chain -->
    <line x1="15" y1="-18" x2="15" y2="-5" stroke="#c9a84c" stroke-width="1.5"/>
    <line x1="30" y1="-18" x2="30" y2="-5" stroke="#c9a84c" stroke-width="1.5"/>
    <!-- Right pan -->
    <ellipse cx="22" cy="-2" rx="16" ry="5" fill="none" stroke="#c9a84c" stroke-width="2"/>
  </g>

  <!-- ===== PEOPLE SILHOUETTES ===== -->
  <!-- Person 1 - walking toward door (left) -->
  <g transform="translate(120, 360)" opacity="0.5">
    <!-- Head -->
    <circle cx="0" cy="-28" r="7" fill="#c9a84c"/>
    <!-- Body -->
    <line x1="0" y1="-21" x2="0" y2="0" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="0" y1="-14" x2="-10" y2="-6" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="10" y2="-4" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs (walking) -->
    <line x1="0" y1="0" x2="-8" y2="18" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="18" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Person 2 - walking toward door (further left) -->
  <g transform="translate(70, 380)" opacity="0.35">
    <circle cx="0" cy="-22" r="5.5" fill="#c9a84c"/>
    <line x1="0" y1="-16" x2="0" y2="0" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="-7" y2="-3" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-10" x2="7" y2="-2" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-6" y2="14" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="14" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Person 3 - walking toward door (left, small/far) -->
  <g transform="translate(50, 400)" opacity="0.2">
    <circle cx="0" cy="-16" r="4" fill="#c9a84c"/>
    <line x1="0" y1="-12" x2="0" y2="0" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="-5" y2="-1" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="5" y2="-1" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="10" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="10" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Person 4 - walking toward door (right side) -->
  <g transform="translate(680, 365)" opacity="0.45">
    <circle cx="0" cy="-26" r="6.5" fill="#c9a84c"/>
    <line x1="0" y1="-19" x2="0" y2="0" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="-9" y2="-4" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-12" x2="9" y2="-5" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-7" y2="16" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7" y2="16" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Person 5 - small/far right -->
  <g transform="translate(730, 390)" opacity="0.25">
    <circle cx="0" cy="-18" r="4.5" fill="#c9a84c"/>
    <line x1="0" y1="-13" x2="0" y2="0" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="-5" y2="-2" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="5" y2="-2" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="11" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="11" stroke="#c9a84c" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Person 6 - entering door (center, closer) -->
  <g transform="translate(380, 310)" opacity="0.55">
    <circle cx="0" cy="-24" r="6" fill="#f5e6b8"/>
    <line x1="0" y1="-18" x2="0" y2="0" stroke="#f5e6b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="-8" y2="-3" stroke="#f5e6b8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="8" y2="-3" stroke="#f5e6b8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-6" y2="15" stroke="#f5e6b8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="15" stroke="#f5e6b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Person 7 - inside door (silhouette in light) -->
  <g transform="translate(430, 290)" opacity="0.3">
    <circle cx="0" cy="-20" r="5" fill="#f5e6b8"/>
    <line x1="0" y1="-15" x2="0" y2="0" stroke="#f5e6b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-9" x2="-6" y2="-3" stroke="#f5e6b8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-9" x2="6" y2="-3" stroke="#f5e6b8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4" y2="12" stroke="#f5e6b8" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="12" stroke="#f5e6b8" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ===== DECORATIVE ELEMENTS ===== -->
  <!-- Corner accents -->
  <polyline points="12,40 12,12 40,12" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <polyline points="760,12 788,12 788,40" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <polyline points="12,460 12,488 40,488" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <polyline points="760,488 788,488 788,460" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

  <!-- Subtle geometric background lines -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#c9a84c" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#c9a84c" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#c9a84c" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#c9a84c" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#c9a84c" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#c9a84c" stroke-width="0.5"/>
  </g>
</svg>
