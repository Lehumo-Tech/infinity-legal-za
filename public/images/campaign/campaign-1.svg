<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 680" xml:space="preserve">
  <title>Know Your Rights SA - Campaign Illustration</title>
  <desc>Campaign illustration for Know Your Rights SA featuring gavel, scales of justice, and South African Constitution elements</desc>

  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3358;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ddc06e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88832;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad1v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ddc06e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a88832;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5e6b8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#eed9a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5cc85;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gavelHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6d2b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#0c1e3c;stop-opacity:0" />
    </radialGradient>

    <!-- SA Flag Accent Pattern -->
    <pattern id="saAccent" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none"/>
      <circle cx="3" cy="3" r="1" fill="#007749" opacity="0.15"/>
      <circle cx="9" cy="9" r="1" fill="#de3831" opacity="0.12"/>
      <circle cx="9" cy="3" r="0.8" fill="#ffffff" opacity="0.08"/>
      <circle cx="3" cy="9" r="0.8" fill="#002395" opacity="0.1"/>
    </pattern>

    <!-- Geometric line pattern -->
    <pattern id="geoLines" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="60" stroke="#c9a84c" stroke-width="0.4" opacity="0.08"/>
      <line x1="60" y1="0" x2="0" y2="60" stroke="#c9a84c" stroke-width="0.4" opacity="0.08"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#c9a84c" stroke-width="0.3" opacity="0.05"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#c9a84c" stroke-width="0.3" opacity="0.05"/>
    </pattern>

    <!-- Filter for soft shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.788  0 0 0 0 0.659  0 0 0 0 0.298  0 0 0 0.3 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="680" fill="url(#bgGrad1)"/>
  <rect width="1200" height="680" fill="url(#geoLines)"/>
  <rect width="1200" height="680" fill="url(#saAccent)"/>
  <rect width="1200" height="680" fill="url(#glowCenter)"/>

  <!-- ===== GEOMETRIC DECORATIVE BORDERS ===== -->
  <!-- Top border -->
  <line x1="0" y1="8" x2="1200" y2="8" stroke="#c9a84c" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>
  <!-- Bottom border -->
  <line x1="0" y1="668" x2="1200" y2="668" stroke="#c9a84c" stroke-width="1" opacity="0.25"/>
  <line x1="0" y1="672" x2="1200" y2="672" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>
  <!-- Corner accents -->
  <polyline points="0,50 0,0 50,0" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
  <polyline points="1150,0 1200,0 1200,50" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
  <polyline points="0,630 0,680 50,680" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
  <polyline points="1150,680 1200,680 1200,630" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== LIGHT RAYS from center ===== -->
  <g opacity="0.12">
    <polygon points="600,300 500,0 530,0" fill="url(#goldGrad1)"/>
    <polygon points="600,300 670,0 700,0" fill="url(#goldGrad1)"/>
    <polygon points="600,300 800,50 825,65" fill="url(#goldGrad1)"/>
    <polygon points="600,300 375,50 400,65" fill="url(#goldGrad1)"/>
    <polygon points="600,300 950,150 965,175" fill="url(#goldGrad1)"/>
    <polygon points="600,300 235,150 250,175" fill="url(#goldGrad1)"/>
  </g>

  <!-- ===== SCALES OF JUSTICE (center-right) ===== -->
  <g transform="translate(720, 280)" filter="url(#goldGlow)">
    <!-- Center pillar -->
    <rect x="-4" y="-120" width="8" height="200" rx="3" fill="url(#goldGrad1v)"/>

    <!-- Base -->
    <ellipse cx="0" cy="80" rx="50" ry="14" fill="url(#goldGrad1)"/>
    <ellipse cx="0" cy="76" rx="50" ry="14" fill="#0c1e3c" opacity="0.3"/>

    <!-- Top ornament -->
    <circle cx="0" cy="-120" r="16" fill="url(#goldGrad1)"/>
    <circle cx="0" cy="-120" r="9" fill="#0c1e3c"/>
    <circle cx="0" cy="-120" r="5" fill="url(#goldGrad1)"/>

    <!-- Beam -->
    <rect x="-170" y="-72" width="340" height="8" rx="4" fill="url(#goldGrad1)"/>

    <!-- Left chains -->
    <line x1="-155" y1="-64" x2="-170" y2="-20" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <line x1="-120" y1="-64" x2="-100" y2="-20" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <line x1="-85" y1="-64" x2="-60" y2="-20" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <!-- Left pan -->
    <ellipse cx="-115" cy="-16" rx="65" ry="18" fill="none" stroke="url(#goldGrad1)" stroke-width="4"/>
    <ellipse cx="-115" cy="-10" rx="58" ry="6" fill="#c9a84c" opacity="0.15"/>

    <!-- Right chains -->
    <line x1="85" y1="-64" x2="60" y2="-30" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <line x1="120" y1="-64" x2="100" y2="-30" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <line x1="155" y1="-64" x2="170" y2="-30" stroke="url(#goldGrad1)" stroke-width="2.5"/>
    <!-- Right pan (slightly lower = weighed) -->
    <ellipse cx="115" cy="-26" rx="65" ry="18" fill="none" stroke="url(#goldGrad1)" stroke-width="4"/>
    <ellipse cx="115" cy="-20" rx="58" ry="6" fill="#c9a84c" opacity="0.15"/>
  </g>

  <!-- ===== GAVEL (left-center) ===== -->
  <g transform="translate(340, 340) rotate(-30)" filter="url(#softShadow)">
    <!-- Handle -->
    <rect x="0" y="-8" width="200" height="16" rx="8" fill="url(#gavelHead)"/>
    <rect x="10" y="-5" width="180" height="3" rx="1.5" fill="#ddc06e" opacity="0.4"/>
    <!-- Head -->
    <rect x="-55" y="-26" width="80" height="52" rx="8" fill="url(#gavelHead)"/>
    <rect x="-48" y="-20" width="66" height="5" rx="2" fill="#ddc06e" opacity="0.3"/>
    <rect x="-48" y="15" width="66" height="5" rx="2" fill="#8a6d2b" opacity="0.4"/>
    <!-- Head bands -->
    <rect x="-55" y="-8" width="80" height="3" fill="#a88832" opacity="0.5"/>
    <rect x="-55" y="5" width="80" height="3" fill="#a88832" opacity="0.5"/>
  </g>

  <!-- Gavel strike lines -->
  <g transform="translate(290, 400)" opacity="0.5">
    <line x1="-15" y1="20" x2="-25" y2="35" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="0" y2="40" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="25" y2="35" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ===== CONSTITUTION / SCROLL (lower-left) ===== -->
  <g transform="translate(180, 440)" filter="url(#softShadow)">
    <!-- Scroll body -->
    <rect x="0" y="10" width="160" height="100" rx="2" fill="url(#scrollGrad)"/>
    <!-- Scroll top roll -->
    <ellipse cx="80" cy="10" rx="82" ry="12" fill="#e5cc85"/>
    <ellipse cx="80" cy="10" rx="75" ry="8" fill="#eed9a0"/>
    <!-- Scroll bottom roll -->
    <ellipse cx="80" cy="110" rx="82" ry="12" fill="#d4b870"/>
    <ellipse cx="80" cy="110" rx="75" ry="8" fill="#e5cc85"/>
    <!-- Text lines on scroll -->
    <line x1="20" y1="32" x2="140" y2="32" stroke="#a88832" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="42" x2="130" y2="42" stroke="#a88832" stroke-width="1.5" opacity="0.35"/>
    <line x1="20" y1="52" x2="140" y2="52" stroke="#a88832" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="62" x2="110" y2="62" stroke="#a88832" stroke-width="1.5" opacity="0.3"/>
    <line x1="20" y1="72" x2="140" y2="72" stroke="#a88832" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="82" x2="125" y2="82" stroke="#a88832" stroke-width="1.5" opacity="0.35"/>
    <line x1="20" y1="92" x2="140" y2="92" stroke="#a88832" stroke-width="1.5" opacity="0.4"/>
    <!-- "Constitution" text on scroll -->
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#0c1e3c" opacity="0.6" letter-spacing="1">CONSTITUTION</text>
  </g>

  <!-- ===== SA FLAG ACCENT RIBBON ===== -->
  <g transform="translate(1020, 500)" opacity="0.6">
    <!-- Y-shape flag -->
    <polygon points="0,0 60,-40 30,0 60,40" fill="#000000" opacity="0.7"/>
    <polygon points="5,0 30,-18 20,0 30,18" fill="#007749" opacity="0.8"/>
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="30" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <!-- Top band red -->
    <rect x="30" y="-40" width="30" height="20" rx="1" fill="#de3831" opacity="0.7"/>
    <!-- Bottom band blue -->
    <rect x="30" y="20" width="30" height="20" rx="1" fill="#002395" opacity="0.7"/>
    <!-- Gold Y-stripe -->
    <line x1="5" y1="0" x2="58" y2="0" stroke="#c9a84c" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- ===== "KNOW YOUR RIGHTS" TEXT ===== -->
  <g transform="translate(600, 560)">
    <!-- Decorative lines flanking text -->
    <line x1="-340" y1="0" x2="-180" y2="0" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
    <line x1="180" y1="0" x2="340" y2="0" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
    <!-- Small diamonds -->
    <polygon points="-182,0 -186,-4 -190,0 -186,4" fill="#c9a84c" opacity="0.5"/>
    <polygon points="182,0 186,-4 190,0 186,4" fill="#c9a84c" opacity="0.5"/>

    <!-- KNOW YOUR -->
    <text x="0" y="-12" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" letter-spacing="10" fill="url(#goldGrad1)">KNOW YOUR</text>
    <!-- RIGHTS -->
    <text x="0" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" letter-spacing="14" fill="url(#goldGrad1)">RIGHTS</text>
    <!-- SA small -->
    <text x="150" y="8" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" letter-spacing="3" fill="#c9a84c" opacity="0.6">SA</text>
  </g>

  <!-- ===== DECORATIVE GEOOMETRIC ELEMENTS ===== -->
  <!-- Top-left corner geometric -->
  <g transform="translate(70, 70)" opacity="0.15">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#c9a84c" stroke-width="1" transform="rotate(45, 20, 20)"/>
    <rect x="10" y="10" width="20" height="20" fill="none" stroke="#c9a84c" stroke-width="0.8" transform="rotate(45, 20, 20)"/>
  </g>
  <!-- Top-right corner geometric -->
  <g transform="translate(1090, 70)" opacity="0.15">
    <polygon points="0,0 35,17.5 0,35" fill="none" stroke="#c9a84c" stroke-width="1"/>
    <polygon points="8,8 27,17.5 8,27" fill="none" stroke="#c9a84c" stroke-width="0.8"/>
  </g>
  <!-- Left mid decorative dots -->
  <g opacity="0.12">
    <circle cx="40" cy="300" r="2" fill="#c9a84c"/>
    <circle cx="40" cy="316" r="2" fill="#c9a84c"/>
    <circle cx="40" cy="332" r="2" fill="#c9a84c"/>
    <circle cx="40" cy="348" r="2" fill="#c9a84c"/>
    <circle cx="56" cy="308" r="2" fill="#c9a84c"/>
    <circle cx="56" cy="324" r="2" fill="#c9a84c"/>
    <circle cx="56" cy="340" r="2" fill="#c9a84c"/>
  </g>
  <!-- Right mid decorative dots -->
  <g opacity="0.12">
    <circle cx="1160" cy="300" r="2" fill="#c9a84c"/>
    <circle cx="1160" cy="316" r="2" fill="#c9a84c"/>
    <circle cx="1160" cy="332" r="2" fill="#c9a84c"/>
    <circle cx="1160" cy="348" r="2" fill="#c9a84c"/>
    <circle cx="1144" cy="308" r="2" fill="#c9a84c"/>
    <circle cx="1144" cy="324" r="2" fill="#c9a84c"/>
    <circle cx="1144" cy="340" r="2" fill="#c9a84c"/>
  </g>

  <!-- ===== SMALL LEGAL ICONS (scattered) ===== -->
  <!-- Paragraph symbol top area -->
  <text x="520" y="100" font-family="Georgia, serif" font-size="60" fill="#c9a84c" opacity="0.07">§</text>
  <!-- Paragraph symbol right area -->
  <text x="980" y="200" font-family="Georgia, serif" font-size="45" fill="#c9a84c" opacity="0.06">§</text>
  <!-- Section sign left -->
  <text x="100" y="220" font-family="Georgia, serif" font-size="50" fill="#c9a84c" opacity="0.06">¶</text>
</svg>
